name: Bug report
description: Something on academy.redduck.io or in the platform code is broken.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where? (URL or page)
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: Browser / device (optional)
    validations:
      required: false
