name: Prepare lesson proposal

# Proposals opened from the in-browser lesson editor arrive as a single Markdown file on a
# `proposal/**` branch. A course's README.md outline is generated from the frontmatter of every
# lesson in that course, so a change to a title, type, order or isHidden makes the committed
# outline stale and `generate-course-index.mjs --check` in content-verify.yml goes red — with a
# failure the contributor has no way to fix from a browser. The pre-commit hook that normally
# regenerates it (.githooks/pre-commit) does not exist for an API-driven commit.
#
# Regenerating here rather than in the backend is deliberate: the outline is built from the whole
# course tree, which a checkout has for free and the backend would have to fetch file by file.
#
# The regenerate and the checks share one job on purpose. A GITHUB_TOKEN push does not re-trigger
# workflows, so the commit made below gets no check run of its own — this job has to be the one
# that proves the branch green.
#
# `contents: write` is a wider permission than content-verify.yml's, so note what bounds it: the
# job runs no contributor-supplied code (yaml.parse does not execute), and the backend only ever
# writes tree entries matching PROPOSAL_PATH_RE under content/, so neither the lockfile nor any
# script on this branch is contributor-reachable.

on:
  push:
    branches:
      - 'proposal/**'
    paths:
      - 'content/**'

permissions:
  contents: write

concurrency:
  group: proposal-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Regenerate outlines, then validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable

      - name: Regenerate course outlines
        run: |
          yarn content:index
          if [ -n "$(git status --porcelain content)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content
            git commit -m "chore: regenerate course outlines"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          else
            echo "Outlines already match the content files."
          fi

      - name: Validate content
        run: node scripts/validate-content.mjs

      - name: Check course outlines are in sync
        run: node scripts/generate-course-index.mjs --check
