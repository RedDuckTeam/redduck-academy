name: Sync content to database

# On merge to main (or manual dispatch), reconciles the content files with the Payload database:
#   1. Assigns ids to any id-less course/module/lesson/question/option files and commits them back,
#      so a stable id lands in the repo *before* the DB write (a later run can't mint a duplicate).
#   2. Inserts new course/module/lesson rows (insert-only; see scripts/sync-content-db.ts).
#   3. Upserts test questions/options and prunes learners' answers (see scripts/sync-tests.mjs).
#
# The id-commit uses the built-in GITHUB_TOKEN, which by design does NOT re-trigger this workflow, so
# there's no loop. It runs only on push to main (post-merge, already reviewed); fork PRs never get a
# write token. If the push is ever rejected, the job fails here — before any DB write — so no id-less
# content is inserted with an unpersisted id (no duplicates).
#
# Requirements:
#   • `main` is NOT a protected branch (GITHUB_TOKEN can't push to a protected branch).
#   • Settings → Actions → General → Workflow permissions = "Read and write permissions".
#   • Repository secret DATABASE_URL (production Postgres); DATABASE_CONNECTION_POOL_URL used in
#     preference when set.

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
  workflow_dispatch: {} # manual full re-sync

permissions:
  contents: write # the id write-back commit; nothing else

concurrency:
  group: content-db-sync
  cancel-in-progress: false # never interrupt a database write

jobs:
  sync:
    name: Assign ids, then sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # setup-node@v4 (matching content-verify.yml): v5's env-details step runs `yarn cache dir`
      # before corepack is enabled, which fails against the pinned Yarn 4 (packageManager field).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: yarn install --immutable

      # Assign ids to id-less files and commit them back BEFORE any DB write. If the push is rejected
      # (e.g. main is still protected), the job fails here and never reaches the DB step, so no
      # id-less content is ever inserted with an unpersisted id.
      - name: Assign & commit content ids
        run: |
          yarn content:assign-ids
          if [ -n "$(git status --porcelain content)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content
            git commit -m "chore: assign content ids [skip ci]"
            git push origin HEAD:main
          else
            echo "No ids to assign."
          fi

      - name: Sync to database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_CONNECTION_POOL_URL: ${{ secrets.DATABASE_CONNECTION_POOL_URL }}
        run: |
          yarn content:db-sync
          yarn content:sync-tests
