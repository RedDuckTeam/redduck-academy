name: Verify content

# Validates the open-source content/ files on every content change to a non-main branch
# or a pull request. No database access and no secrets — it only parses the Markdown and
# frontmatter (shape, required fields, slugs, tree completeness, and id uniqueness). The
# insert-to-DB step lives in the main deploy workflow, gated behind this passing.

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'content/**'
      - 'scripts/validate-content.mjs'
      - 'scripts/generate-course-index.mjs'
      - '.github/workflows/content-verify.yml'
  pull_request:
    paths:
      - 'content/**'
      - 'scripts/validate-content.mjs'
      - 'scripts/generate-course-index.mjs'
      - '.github/workflows/content-verify.yml'

permissions:
  contents: read

concurrency:
  group: verify-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate content files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - name: Validate content
        run: node scripts/validate-content.mjs
      # Skipped for pull requests from a fork. The outline is regenerated by the pre-commit hook in
      # .githooks, which only runs for someone working in a clone of this repository — an outside
      # contributor (including anyone the site's editor sends to GitHub's own web editor) commits
      # without it and cannot be asked to run it. content-sync.yml refreshes the outlines on main
      # after the merge instead. Branches inside this repository are still checked, because
      # maintainers do have the hook, and everything else in this workflow applies to forks too.
      - name: Check course outlines are in sync
        if: "!github.event.pull_request.head.repo.fork"
        run: node scripts/generate-course-index.mjs --check
