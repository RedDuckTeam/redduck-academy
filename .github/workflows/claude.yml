name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Run only on a literal @claude mention AND only from a trusted actor — the repo owner,
    # an org member, or an invited collaborator. These events execute in the base-repo context
    # with secrets and a write token even when they come from a fork PR, so gating on author
    # association here stops an outside contributor from starting a privileged, API-key-consuming
    # job. (The action enforces the same permission check internally; this refuses the run before
    # it ever spins up.)
    #
    # The association gate covers who *starts* the job, not whose text it reads. A proposal opened
    # from the site editor carries attacker-controlled prose in its diff and body, so those PRs are
    # excluded outright — otherwise a maintainer typing "@claude" on one would hand that prose to a
    # job holding contents:write and the API key. This depends on the label always being applied.
    if: |
      !contains(github.event.issue.labels.*.name, 'community-proposal') &&
      !contains(github.event.pull_request.labels.*.name, 'community-proposal') &&
      (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
